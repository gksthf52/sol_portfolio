<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="퍼블리셔 한솔 포트폴리오" />
    <title>한솔 | Publisher</title>

    <!-- googleapis font BBH Hegarty -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BBH+Hegarty&family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 스킵 네비게이션 -->
    <a href="#hero" class="skip-nav">본문 바로가기</a>

    <!-- 인트로 애니메이션 영역 -->
    <!-- <div id="intro">
      <div class="text_box">
        <div class="text_box_area">
          <span class="name">Hansol</span>
          <span class="pf">Portfolio</span>
        </div>
        <span class="dot"></span>
      </div>
    </div> -->

    <!-- 본문 영역 -->
    <div id="wrap" class="wrap">
      <header class="header">
        <h1 class="logo">
          <a href="/" aria-label="Hansol's Portfolio 홈">HS</a>
        </h1>

        <nav class="nav">
          <ul class="nav_list">
            <li class="nav_item"><a href="#career">Career</a></li>
            <li class="nav_item"><a href="#works">Works</a></li>
            <li class="nav_item"><a href="#skills">Skills</a></li>
          </ul>
        </nav>

        <div class="util">
          <a href="#" class="about_me card">
            <div class="card_inner">
              <div class="card_front">
                <img src="/images/me.png" alt="내 프로필 이미지" />
              </div>
              <div class="card_back">
                <span>about</span>
              </div>
            </div>
          </a>
        </div>
      </header>

      <!-- Hero -->
      <section id="hero">
        <div class="container">
          <div class="center_box">
            <div class="fade-list">
              <div class="fade-item">H</div>
              <div class="fade-item">A</div>
              <div class="fade-item">N</div>
              <div class="fade-item">S</div>
              <div class="fade-item">O</div>
              <div class="fade-item">L</div>
              <div class="fade-item">'</div>
              <div class="fade-item">S</div>
            </div>
            <div class="fade-list">
              <div class="fade-item">P</div>
              <div class="fade-item">O</div>
              <div class="fade-item">R</div>
              <div class="fade-item">T</div>
              <div class="fade-item">F</div>
              <div class="fade-item">O</div>
              <div class="fade-item">L</div>
              <div class="fade-item">I</div>
              <div class="fade-item">O</div>
            </div>
          </div>
        </div>
        <div class="bottom_text">
          <p>제 포트폴리오 사이트에 방문해주셔서 감사합니다.</p>
        </div>
      </section>

      <!-- Career -->
      <section id="career">
        <div class="container stagger">
          <h2 class="section-title stagger-item">career</h2>
          <div class="career_list">
            <ul>
              <li class="career_item stagger-item">
                <p class="career_tit">HNINE<span>2022.01~2025.10</span></p>
                <div class="career_content">
                  <img src="https://picsum.photos/800/600" alt="이미지" />
                </div>
              </li>
              <li class="career_item stagger-item">
                <p class="career_tit">EDULAB<span>2021.04~2021.10</span></p>
                <div class="career_content">
                  <img src="https://picsum.photos/800/500" alt="이미지" />
                </div>
              </li>
              <li class="career_item stagger-item">
                <p class="career_tit">THE DAOM<span>2018.11~2020.05</span></p>
                <div class="career_content">
                  <img src="https://picsum.photos/800/200" alt="이미지" />
                </div>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <!-- Works -->
      <section id="works">
        <div class="container stagger">
          <h2 class="section-title stagger-item">works</h2>
          <div class="works_list">
            <ul class="stagger-side">
              <li class="left">
                <img src="https://picsum.photos/800/1400" alt="이미지" />
              </li>
              <li class="right">
                <img src="https://picsum.photos/800/2400" alt="이미지" />
              </li>
              <li class="left">
                <img src="https://picsum.photos/800/1200" alt="이미지" />
              </li>
              <li class="right">
                <img src="https://picsum.photos/800/4400" alt="이미지" />
              </li>
            </ul>
          </div>
        </div>
      </section>

      <!-- Skills -->
      <section id="skills">
        <div class="container">
          <h2 class="section-title">Skills</h2>
          <div class="fade-up"></div>
        </div>
      </section>

      <footer class="footer"></footer>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
